name: Studio quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Check deterministic release fingerprint
        run: |
          cp release.json /tmp/juice-release-first.json
          npm run build
          cmp release.json /tmp/juice-release-first.json
